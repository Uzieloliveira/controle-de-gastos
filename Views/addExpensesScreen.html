<div id="add-expenses" class="screenStyle">
    <h1>Adicionar despesa</h1>
    <form action="">
        <div class="inputType">
            <p>Tipo de despesa</p>
            <input type="text">
        </div>

        <div class="inputAmount">
            <p>Valor</p>
            <input type="text">
        </div>

        <div class="inputDueDate">
            <p>Data Vencimento</p>
            <div id="day_Month_Year">
                <input type="number" id="day">

                <input type="number" id="month">

                <input type="number" id="year">
            </div>
        </div>

        <div class="buttonSubmit">
            <button>Adicionar</button>
        </div>
    </form>
</div>
