<div id="add-expenses" class="screenStyle">
    <h1>&nbsp<i class="fa-solid fa-chevron-left" id="arrowBack"></i>&nbspAdicionar despesa</h1>
    <form id="expensesForm">
        <div class="inputType">
            <label for="description">Descrição</label>
            <input id="description" type="text" required placeholder="Ex: Conta de luz, aluguel, internet..">
        </div>

        <div class="inputAmount">
            <label for="amount">Valor</label>
            <input id="amount" type="number" step="any" required placeholder="Ex: 150">
        </div>

        <div class="inputMonth">
            <label for="month">Mês</label>
            <input id="month" type="month" required placeholder="Escolha o mês" text-align="center">
        </div>

        <div id="options">
            <fieldset>

                <legend>Recorrência</legend>

                <div>
                    <input type="radio" id="repetition" name="expense" value="repetição" >
                    <label for="repetition">Repetição</label>
                    <span id="dueDateView" style="color: var(---theme-color);"> Dia: --</span>
                </div>

                <div>
                    <input type="radio" id="variable" name="expense" value="variável">
                    <label for="variable">Variável</label>
                </div>

            </fieldset>
        </div>

        <div id="expenses_situation">
            <fieldset>
                <legend>Situação</legend>
                <button class="situation" id="paid" value="pago">Pago</button>
                <button class="situation" id="payable" value="a pagar">A pagar</button>
                <button class="situation" id="scheduled" value="agendado">Agendado</button>
            </fieldset>
        </div>

        <div class="buttonSubmit">
            <button class="submit-expense" type="submit">Adicionar</button>
        </div>

        <div id="dueDate-container" class="noActive">
            <div id="dueDate" >
                <span>Dia do vencimento</span>
                <input type="number" placeholder="Ex: 15" id="day">
                <div class="btns">
                    <button id="confirm">confirmar</button>
                    <button id="close_popUp_dueDate">fechar</button>
                </div>
            </div>
        </div>

    </form>
</div>
