    <!-- filtro -->
    <div class="filter">

      <div class="month">
        <p>Adicionar filtro:</p>
        <div id="filterInputs">

          <div class="inputs">
            <input type="month" id="inputMonth_home">

          <button id="resultFilter">
            filtrar resultados
          </button>

      </div>

    <div class="table-container">

        </thead>
        <tbody id="list-content">

        </tbody>
      </table>
