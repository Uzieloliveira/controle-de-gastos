      <div>

        <button id="searchResult"><i class="fa-solid fa-magnifying-glass"></i></button>

    <div class="table-container">
      <table id="list-expenses">

          <tr>

        </thead>
        <tbody id="list-content">

        </tbody>

    </div>
    <div id="displayInformations">

    </div>
  </div>
</div>
